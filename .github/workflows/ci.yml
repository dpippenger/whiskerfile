name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` as well as the defaults, so the title check below sees a changed title.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  format:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run format:check

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Installs the canary that .bun-canary-version pins: only canary has the linter.
      - run: bun run lint

  typecheck:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun check

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # CHROMIUM_PATH is unset, so the one test that prints with a real browser
      # is skipped; the image job prints a report with the image's own Chromium.
      - run: bun test

  # Conventional Commits, for the pull request's title and each of its commits.
  # On a push to main there is nothing left to check and the job passes.
  commitlint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bun x commitlint --verbose
      - name: Pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun x commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Files, exports and dependencies nothing uses.
  unused:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run check:unused

  # The committed migrations are consistent and match src/server/db/schema.ts.
  migrations:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run check:migrations

  # Known vulnerabilities in the locked dependencies, at high severity and above.
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun audit --audit-level=high

  # The image runs from source, so only a booted container shows whether the
  # front end bundles and Chromium prints.
  image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: The image runs the Bun that CI tests with
        run: grep -qx "FROM oven/bun:$(cat .bun-version)-slim" Dockerfile
      - run: docker build -t whiskerfile:ci .
      - run: .github/scripts/image-smoke.sh whiskerfile:ci

  # The one check the main branch requires. It fails unless every job above
  # succeeded, so a skipped or failed job can't pass as green, and a cancelled
  # run never reports success.
  ci-gate:
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    needs: [format, lint, typecheck, test, commitlint, unused, migrations, audit, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
